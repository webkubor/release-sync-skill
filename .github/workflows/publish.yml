name: Publish

# 推 v* tag 时自动建 GitHub Release。SKILL.md version 强同步由
# SKILL_SPEC 保证（tag == SKILL version），这里只生成 Release + 校验一致性。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 SKILL.md version 强同步
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(grep -m1 '^version:' SKILL.md | awk '{print $2}')"
          if [ "$TAG" != "$VER" ]; then
            echo "tag v$TAG 与 SKILL.md version $VER 不一致（SKILL_SPEC 强同步要求）"; exit 1
          fi
          echo "✓ tag v$TAG == SKILL.md version $VER"

      - name: GitHub Release（缺失时补建）
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME 已存在，跳过"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
